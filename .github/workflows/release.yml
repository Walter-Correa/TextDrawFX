name: Release

# Builds and packages TextDrawFX with include, demo script, demo AMX, and license,
# and publishes the standalone archive as a GitHub release with the version's changelog.
# Releases are triggered manually by hand: Actions > Release > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          # Copy Library Include, Demo script, Demo AMX, and License
          if (Test-Path "TextDrawFX.inc") { Copy-Item "TextDrawFX.inc" "package/TextDrawFX.inc" -Force }
          if (Test-Path "FS_TextDrawFX_Demo.pwn") { Copy-Item "FS_TextDrawFX_Demo.pwn" "package/FS_TextDrawFX_Demo.pwn" -Force }
          if (Test-Path "FS_TextDrawFX_Demo.amx") { Copy-Item "FS_TextDrawFX_Demo.amx" "package/FS_TextDrawFX_Demo.amx" -Force }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "package/LICENSE" -Force }

      - name: Compress Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path package/* -DestinationPath dist/TextDrawFX.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TextDrawFX
          path: dist/TextDrawFX.zip

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read Version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path TextDrawFX.inc -Pattern '#define\s+TEXTDRAWFX_VERSION_STRING\s+"([^"]+)"'
          if (-not $m) { throw "TEXTDRAWFX_VERSION_STRING not found in TextDrawFX.inc" }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: TextDrawFX
          path: dist

      - name: Extract Release Notes from README.md
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = (Get-Content README.md -Encoding utf8) -replace "`r$", ""
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^### $([regex]::Escape($v)) ") { $start = $i; break }
          }
          if ($start -lt 0) { throw "No section for version $v in the Version history of README.md" }
          $body = @()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^### " -or $lines[$i] -match "^</details>") { break }
            $body += $lines[$i]
          }
          $body = ($body -join "`n").Trim()
          if (-not $body) { throw "The section of version $v in README.md is empty" }
          $notes = $body
          [System.IO.File]::WriteAllText((Join-Path $PWD "release-notes.md"), $notes, (New-Object System.Text.UTF8Encoding($false)))

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $title = "TextDrawFX $tag"
          $files = @(
            "dist/TextDrawFX.zip"
          )
          if (gh release view $tag 2>$null) {
            Write-Host "Updating release $tag..."
            gh release upload $tag $files --clobber
            gh release edit $tag --title $title --notes-file release-notes.md
          } else {
            Write-Host "Creating new release $tag..."
            gh release create $tag $files --target $env:GITHUB_SHA --title $title --notes-file release-notes.md
          }
